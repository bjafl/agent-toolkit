[project]
name = "agent-toolkit"
version = "0.1.0"
description = "CLI tools for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# One entry point per tool: <command> = "agent_toolkit.<module>:main"
# Install globally (editable) with: uv tool install --editable .
[project.scripts]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
